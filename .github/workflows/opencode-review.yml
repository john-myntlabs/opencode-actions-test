name: opencode-review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: opencode-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenCode Review
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Post pending status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" \
            -d '{"state":"pending","context":"opencode-review","description":"OpenCode review in progress...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Resolve PR context
        id: pr-context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo=${{ github.repository }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          pr_number="${{ github.event.workflow_run.pull_requests[0].number || '' }}"
          if [ -z "$pr_number" ]; then
            pr_number=$(curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/commits/$head_sha/pulls" \
              | jq -r 'map(select(.state == "open")) | first | .number // empty')
          fi
          if [ -z "$pr_number" ]; then
            echo "Unable to resolve PR number for head SHA $head_sha"
            exit 1
          fi
          pr_data=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/pulls/$pr_number")
          base_ref=$(echo "$pr_data" | jq -r '.base.ref // ""')
          if [ "$base_ref" = "dev" ] || [ "$base_ref" = "main" ]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "No review needed for base branch: $base_ref"
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Gate checks
        id: gate
        if: steps.pr-context.outputs.matched == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ steps.pr-context.outputs.pr_number }}
          repo=${{ github.repository }}
          pr_data=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/pulls/$pr_number" \
            || echo '{}')
          is_draft=$(echo "$pr_data" | jq -r '.draft // false')
          labels=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/issues/$pr_number/labels" \
            || echo '[]')
          has_fix_label=$(echo "$labels" | jq -r '[.[].name] | contains(["opencode-fix"])')
          if [ "$is_draft" = "true" ] || [ "$has_fix_label" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install opencode
        if: steps.pr-context.outputs.matched == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode review (dev)
        if: steps.pr-context.outputs.base_ref == 'dev' && steps.gate.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: openrouter/minimax/minimax-m2.7
          USE_GITHUB_TOKEN: "true"
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_REF: ${{ steps.pr-context.outputs.base_ref }}
          REPO: ${{ github.repository }}
          PROMPT: |
            You are performing a production-grade PR review for the Specswap-Data repository.
            Use CLAUDE.md and CONTRIBUTING.md as the source of truth for conventions and standards.
            Review the current HEAD diff directly — do not trust commit messages.

            Focus on:
            - Correctness, regressions, edge cases
            - Architecture, state, async/concurrency behavior
            - Security risks (input validation, auth/authz, injection/XSS/SSRF, data exposure)
            - API contracts and backward compatibility
            - Data integrity, schema/migration safety, production impact
            - Test and CI reliability (lint, format, tests, build)

            Also validate PR operational state:
            - draft/open status, mergeability, merge conflicts
            - reviewDecision, CI checks status
            - pending comments/reviews

            If the diff is large, prioritize highest-risk areas and state residual risk for unreviewed sections.

            ## Output

            ### 1) Findings
            Order by severity: BLOCKER → CRITICAL → WARNING → NOTE
            Each finding must include:
            - File and snippet
            - Practical impact
            - Actionable suggestion

            ### 2) Open Questions / Assumptions

            ### 3) Verdict
            APPROVED / CHANGES REQUESTED / NOT READY

            ### 4) Next Actions
            - Must-fix (for CHANGES REQUESTED / NOT READY)
            - Recommended

            ## Rules
            - APPROVED only if no BLOCKER or CRITICAL exists.
            - Any BLOCKER → verdict must be NOT READY.
        run: |
          PR_EVENT=$(mktemp)
          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" \
            --arg repo "$REPO" \
            '{"action":"synchronize","pull_request":{"number":$pr_number,"head":{"sha":$head_sha},"base":{"ref":$base_ref}},"repository":{"full_name":$repo}}' \
            > "$PR_EVENT"
          export GITHUB_EVENT_NAME=pull_request
          export GITHUB_EVENT_PATH="$PR_EVENT"
          opencode github run

      - name: Run OpenCode review (main)
        if: steps.pr-context.outputs.base_ref == 'main' && steps.gate.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: openrouter/minimax/minimax-m2.7
          USE_GITHUB_TOKEN: "true"
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_REF: ${{ steps.pr-context.outputs.base_ref }}
          REPO: ${{ github.repository }}
          PROMPT: |
            You are acting as a highly rigorous Senior Staff Engineer performing a deep,
            production-grade review of this PR for the Specswap-Data repository.
            Use CLAUDE.md and CONTRIBUTING.md as the source of truth.
            Do not trust commit messages — validate against the actual diff.

            ## Objective
            Identify real production risks, not just code style.

            ## Review Criteria
            - Correctness, regressions, and edge cases
            - Architecture, state management, and concurrency risks
            - Security: XSS, SQL injection, SSRF, prototype pollution, open redirect,
              command injection, path traversal
            - Imports and symbols (verify existence and correct scope)
            - Async flows, concurrency, and error handling
            - Data integrity, migrations, and production impact
            - API contract changes and backward compatibility
            - PR state: draft/open, mergeability, reviewDecision, CI checks, merge conflicts,
              prior reviews
            - Schema compatibility and production impact
            - State/status consistency with existing code
            - CI checks: lint, format, tests, build
            - Pending comments/reviews on the PR

            If the diff is large: sample high-risk areas and explicitly state residual risk
            for unreviewed parts.

            ## Output

            ### 1) Findings
            Sorted by severity: BLOCKER → CRITICAL → WARNING → NOTE
            Each finding must include:
            - File and snippet
            - Practical impact
            - Actionable suggestion

            ### 2) Open Questions / Assumptions

            ### 3) Verdict
            APPROVED / CHANGES REQUESTED / NOT READY

            ### 4) Next Actions
            - Must-fix
            - Recommended

            ## Rules
            - APPROVED only if no relevant risks are found.
            - Any BLOCKER (failing CI, merge conflicts, draft status, critical bug) →
              verdict must be NOT READY.
            - All output in English, Markdown format.
        run: |
          PR_EVENT=$(mktemp)
          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" \
            --arg repo "$REPO" \
            '{"action":"synchronize","pull_request":{"number":$pr_number,"head":{"sha":$head_sha},"base":{"ref":$base_ref}},"repository":{"full_name":$repo}}' \
            > "$PR_EVENT"
          export GITHUB_EVENT_NAME=pull_request
          export GITHUB_EVENT_PATH="$PR_EVENT"
          opencode github run

      - name: Strip opencode session footer from PR comment
        if: steps.pr-context.outputs.matched == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ steps.pr-context.outputs.pr_number }}
          repo=${{ github.repository }}
          comment=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/issues/$pr_number/comments" \
            | jq '[.[] | select(.user.login == "github-actions[bot]")] | last')
          comment_id=$(echo "$comment" | jq -r '.id // empty')
          if [ -z "$comment_id" ]; then
            echo "No bot comment found, skipping footer strip"
            exit 0
          fi
          cleaned=$(echo "$comment" | jq -r '.body // ""' \
            | sed '/^<a href="https:\/\/opencode\.ai\/s\//,$d')
          jq -n --arg body "$cleaned" '{"body": $body}' \
          | curl -sf -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$repo/issues/comments/$comment_id" \
            -d @-
          echo "Session footer stripped from comment $comment_id"

      - name: Submit formal review from opencode verdict
        if: steps.pr-context.outputs.matched == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ steps.pr-context.outputs.pr_number }}
          repo=${{ github.repository }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          comment_body=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/issues/$pr_number/comments" \
            | jq -r '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // ""')
          verdict=$(printf '%s' "$comment_body" \
            | grep -ioE '\bAPPROVED\b|CHANGES REQUESTED|NOT READY' | head -1)
          echo "Opencode verdict: $verdict"
          if [ "$verdict" = "APPROVED" ]; then
            review_event="APPROVE"
            review_body="OpenCode verdict: APPROVED"
            inline_comments="[]"
          else
            review_event="REQUEST_CHANGES"
            review_body="OpenCode verdict: ${verdict:-NOT READY}"
            inline_comments=$(printf '%s' "$comment_body" | python3 -c "
          import sys, re, json
          body = sys.stdin.read()
          comments = []
          for chunk in re.split(r'\n(?=#{1,4} |\*\*(?:BLOCKER|CRITICAL|WARNING|NOTE)\b)', body):
              m = re.search(r'\x60([a-zA-Z0-9_./-]+\.[a-zA-Z]{1,5}):(\d+)(?:-\d+)?\x60', chunk)
              if m:
                  comments.append({'path': m.group(1), 'line': int(m.group(2)), 'side': 'RIGHT', 'body': chunk.strip()})
          print(json.dumps(comments))
          " 2>/dev/null || echo '[]')
          fi
          post_review() {
            printf '%s' "$1" \
            | curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$repo/pulls/$pr_number/reviews" \
              -d @-
          }
          echo "Submitting review event: $review_event"
          payload=$(jq -n \
            --arg event "$review_event" \
            --arg body "$review_body" \
            --arg commit_id "$head_sha" \
            --argjson comments "$inline_comments" \
            'if ($comments | length) > 0
             then {"event":$event,"body":$body,"commit_id":$commit_id,"comments":$comments}
             else {"event":$event,"body":$body,"commit_id":$commit_id}
             end')
          response=$(post_review "$payload")
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "HTTP status: $http_status"
          if [ "$http_status" != "200" ] && [ "$http_status" != "201" ]; then
            if [ "$(printf '%s' "$inline_comments" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null)" != "0" ]; then
              echo "Inline comments failed (HTTP $http_status), retrying without..."
              payload=$(jq -n \
                --arg event "$review_event" \
                --arg body "$review_body" \
                --arg commit_id "$head_sha" \
                '{"event":$event,"body":$body,"commit_id":$commit_id}')
              response=$(post_review "$payload")
              http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
              echo "HTTP status: $http_status"
            fi
          fi
          if [ "$http_status" != "200" ] && [ "$http_status" != "201" ]; then
            echo "Failed to submit review (HTTP $http_status)"
            exit 1
          fi

      - name: Enforce review result
        if: always() && steps.pr-context.outputs.matched == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ steps.pr-context.outputs.pr_number }}
          repo=${{ github.repository }}
          state="NONE"
          for i in 1 2 3 4 5; do
            state=$(curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/pulls/$pr_number/reviews" \
              | jq -r 'sort_by(.submitted_at) | last | .state // "NONE"' \
              2>/dev/null || echo "NONE")
            echo "Attempt $i: Latest review state: $state"
            if [ "$state" = "APPROVED" ]; then
              break
            fi
            sleep 5
          done
          if [ "$state" != "APPROVED" ]; then
            echo "OpenCode review did not pass (state: $state). Blocking merge."
            exit 1
          fi
          echo "OpenCode review passed."

      - name: Post final status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            desc="OpenCode review approved"
          else
            state="failure"
            desc="OpenCode review did not pass"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"opencode-review\",\"description\":\"$desc\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
